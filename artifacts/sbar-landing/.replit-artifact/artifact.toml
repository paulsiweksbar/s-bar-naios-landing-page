kind = "web"
previewPath = "/"
title = "S-Bar Construction Landing"
version = "1.0.0"
id = "artifacts/sbar-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23407

[services.development]
run = "pnpm --filter @workspace/sbar-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sbar-landing", "run", "build" ]
publicDir = "artifacts/sbar-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23407"
BASE_PATH = "/"
